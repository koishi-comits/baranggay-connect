<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bg)"/>

  <!-- White circle -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="3.5"/>

  <!-- Plus / cross icon -->
  <line x1="32" y1="21" x2="32" y2="43" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="43" y2="32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
